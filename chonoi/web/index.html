<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 12, 16, .72); backdrop-filter: blur(3px); }
  .ov.on { display: flex; }
  .card { background: #1c2630; border: 2px solid #c9a36b; border-radius: 12px; padding: 24px 32px; min-width: 360px; max-width: 640px; text-align: center; }
  .card h1 { margin: 0 0 8px; font-size: 34px; color: #ffd27a; }
  .card h2 { margin: 0 0 12px; font-size: 26px; color: #ffd27a; }
  .card p, .card li { font-size: 19px; margin: 6px 0; }
  .card ul { text-align: left; padding-left: 22px; }
  .btn { display: block; width: 100%; margin: 10px 0; padding: 12px; font-size: 20px; border-radius: 8px; border: 0; background: #e8892b; color: #111; cursor: pointer; }
  .btn.sec { background: #46525e; color: #e8eef2; }
  .hint { color: #9fb3c0; font-size: 18px; }
  .set { display: flex; gap: 8px; margin-top: 6px; }
  .set .btn { margin: 4px 0; font-size: 18px; padding: 8px; }
  .lb { text-align: left; margin: 8px auto; font-size: 18px; }
  .lb td { padding: 2px 10px; }
  input.name { font-size: 20px; padding: 8px; width: 70%; border-radius: 6px; border: 2px solid #c9a36b; }
  body.hc .card { background: #000; border: 4px solid #fff; color: #fff; }
  body.hc .card h1, body.hc .card h2 { color: #ffff00; }
  body.hc .btn { background: #ffff00; color: #000; border: 3px solid #fff; font-weight: bold; }
  body.hc .btn.sec { background: #000; color: #fff; }
  body.hc .hint { color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="menu"><div class="card">
  <h1>Quán Ăn Chợ Nổi</h1>
  <p class="hint">Út Sen lặn bắt cá, hái bông trên sông Chín Khúc rồi tối mở quán trên nhà bè của Má Tư.</p>
  <button class="btn" id="bPlay">Chơi</button>
  <button class="btn sec" id="bQuit">Thoát</button>
  <div class="set"><button class="btn sec" data-set="hc"></button><button class="btn sec" data-set="sound"></button><button class="btn sec" data-set="captions"></button></div>
  <p class="hint">Phím tắt: H tương phản cao · M âm thanh · C phụ đề</p>
</div></div>
<div class="ov" id="pause"><div class="card">
  <h2>Tạm dừng</h2>
  <button class="btn" id="bResume">Tiếp tục</button>
  <button class="btn sec" id="bToMenu">Về menu</button>
  <p class="hint">Cài đặt</p>
  <div class="set"><button class="btn sec" data-set="hc"></button><button class="btn sec" data-set="sound"></button><button class="btn sec" data-set="captions"></button></div>
  <p class="hint">Esc / P để tiếp tục</p>
</div></div>
<div class="ov" id="intro"><div class="card" id="introCard"></div></div>
<div class="ov" id="quit"><div class="card"><h2>Đã thoát</h2><p class="hint">Có thể đóng tab này (Ctrl+C ở terminal để tắt máy chủ).</p></div></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input; luật nằm trong sim.
 * Phím: WASD / mũi tên di chuyển · E interact · Space catch · Esc/P pause · 1/2 mua oxy/Máu trong Shop ·
 * Enter đóng Shop · R chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const $ = (id) => document.getElementById(id);
const post = (path, body) => fetch(path, { method: "POST", body: body ? JSON.stringify(body) : "", headers: { "Content-Type": "application/json" } }).catch(() => {});

// ---------- tên hiển thị ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const UP_NAME = { oxygen: "Bình oxy", hp: "Áo phao" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dn = (d) => DISH_NAME[d] || d;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
function currentInput() {
  const quan = snap && snap.phase === "quan";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (quan) dy = -dy;                                           // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function pushInput(extra) {
  const body = Object.assign(currentInput(), extra || {});
  const s = JSON.stringify(body);
  if (!extra && s === lastSent) return;
  lastSent = JSON.stringify(currentInput());
  queue.push(s); flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); } catch (e) { /* poll sẽ báo */ }
  }
  inflight = false;
}
function tapPause() { down.add("pause"); pushInput(); down.delete("pause"); pushInput(); }
const ui = () => (snap && snap.ui) || {};
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.target.tagName === "INPUT") return;
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  const u = ui();
  if (u.screen !== "game") return;
  if (u.intro && u.intro.kind !== "summary") { post("/skip"); e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "escape" || k === "p") down.add("pause");
  else if (k === "enter") down.add("shop_done");
  else if (k === "1" && snap && snap.phase === "shop") { pushInput({ buy: "oxygen" }); return; }
  else if (k === "2" && snap && snap.phase === "shop") { pushInput({ buy: "hp" }); return; }
  else if (k === "r") { post("/start"); lastSent = ""; down.clear(); return; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });
$("bPlay").onclick = () => { post("/start"); lastSent = ""; down.clear(); };
$("bQuit").onclick = () => post("/quit");
$("bResume").onclick = () => tapPause();
$("bToMenu").onclick = () => { post("/menu"); down.clear(); };

// ---------- cài đặt: tương phản cao, âm thanh, phụ đề (lưu giữa các lần mở game) ----------
const SET = { hc: false, sound: true, captions: true };
try { Object.assign(SET, JSON.parse(localStorage.getItem("chonoi.settings") || "{}")); } catch (e) { /* bỏ qua */ }
if (new URLSearchParams(location.search).get("hc") === "1") SET.hc = true;  // ?hc=1: bật sẵn tương phản cao
if (new URLSearchParams(location.search).get("sound") === "0") SET.sound = false;  // ?sound=0: tắt âm thanh (kiểm phụ đề)
const SET_LABEL = { hc: ["Tương phản cao: Tắt", "Tương phản cao: Bật"], sound: ["Âm thanh: Tắt", "Âm thanh: Bật"], captions: ["Phụ đề: Tắt", "Phụ đề: Bật"] };
function applySettings() {
  document.body.classList.toggle("hc", SET.hc);
  document.querySelectorAll("[data-set]").forEach((b) => (b.textContent = SET_LABEL[b.dataset.set][SET[b.dataset.set] ? 1 : 0]));
  try { localStorage.setItem("chonoi.settings", JSON.stringify(SET)); } catch (e) { /* bỏ qua */ }
}
function toggleSetting(k) { SET[k] = !SET[k]; applySettings(); }
document.querySelectorAll("[data-set]").forEach((b) => (b.onclick = () => toggleSetting(b.dataset.set)));
applySettings();
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.repeat || e.target.tagName === "INPUT") return;
  if (k === "h") toggleSetting("hc"); else if (k === "m") toggleSetting("sound"); else if (k === "c") toggleSetting("captions");
});

// ---------- âm thanh (WebAudio, tự tổng hợp) + phụ đề SFX ----------
const SFX = {
  dive: [220, "[tiếng nước ùm]"], surface: [520, "[tiếng phà hơi]"], gather: [660, "[tiếng ngắt bông]"],
  fish_caught: [740, "[tiếng cá quẫy]"], hold_full: [180, "[tiếng giỏ đầy]"], oxygen_empty: [140, "[tiếng báo hết hơi]"],
  choke: [120, "[tiếng sặc nước]"], monster_hit: [90, "[tiếng Cá Sấu đớp]"], faint: [70, "[tiếng ngất lịm]"],
  spoiled: [300, "[tiếng ruồi vo ve: hàng ươn]"], fish_spawned: [880, "[tiếng nước lăn tăn]"],
  customer_arrived: [600, "[tiếng chào khách]"], cook_started: [330, "[tiếng xèo xèo]"], dish_ready: [990, "[tiếng chuông bếp]"],
  served: [520, "[tiếng đặt dĩa]"], paid: [1200, "[tiếng tiền rơi leng keng]"], customer_left: [160, "[tiếng khách càu nhàu]"],
  no_dish: [200, "[tiếng thở dài: hết món]"], bought: [1100, "[tiếng chuông mua hàng]"], buy_failed: [150, "[tiếng từ chối]"],
};
let audio = null, lastEvTick = -1;
const captions = [];
function beep(freq) {
  if (!SET.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.type = "triangle";
    g.gain.setValueAtTime(0.12, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.26);
  } catch (e) { /* trình duyệt chặn âm thanh: phụ đề vẫn hiện */ }
}
function onEvents(evs) {
  // chỉ xử lý event mới (tick lớn hơn lần trước); restart thì tick quay về nhỏ -> đặt lại
  if (evs.length && evs[evs.length - 1].tick < lastEvTick) lastEvTick = -1;
  evs.forEach((e) => {
    if (e.tick <= lastEvTick) return;
    const sfx = SFX[e.name];
    if (!sfx) return;
    beep(sfx[0]);
    captions.push({ text: sfx[1], until: performance.now() + 2500 });
  });
  if (evs.length) lastEvTick = Math.max(lastEvTick, evs[evs.length - 1].tick);
}
function drawCaptions(w, h) {
  const now = performance.now();
  while (captions.length && captions[0].until < now) captions.shift();
  if (!SET.captions) return;
  captions.slice(-3).forEach((c, i, arr) => {
    const y = h - 110 - (arr.length - 1 - i) * 34;
    ctx.font = "bold 20px system-ui, sans-serif";
    const tw = ctx.measureText(c.text).width + 24;
    ctx.fillStyle = SET.hc ? "#000" : "rgba(0,0,0,.7)"; ctx.fillRect(w / 2 - tw / 2, y - 24, tw, 32);
    if (SET.hc) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - tw / 2, y - 24, tw, 32); }
    text(c.text, w / 2, y, { align: "center", bold: true, size: 20, color: SET.hc ? "#ffff00" : "#fff" });
  });
}

// ---------- cảnh báo dễ nhận biết: biểu tượng + chữ, hộp nổi; tương phản cao: vàng trên đen, viền trắng dày ----------
function warn(icon, msg, y, color) {
  const label = icon + " " + msg;
  ctx.font = "bold 26px system-ui, sans-serif";
  const tw = ctx.measureText(label).width + 36, x = cv.clientWidth / 2 - tw / 2;
  ctx.fillStyle = SET.hc ? "#000" : "rgba(20,0,30,.78)"; ctx.fillRect(x, y - 30, tw, 42);
  ctx.strokeStyle = SET.hc ? "#fff" : color; ctx.lineWidth = SET.hc ? 4 : 2; ctx.strokeRect(x, y - 30, tw, 42); ctx.lineWidth = 1;
  text(label, cv.clientWidth / 2, y, { align: "center", bold: true, size: 26, color: SET.hc ? "#ffff00" : color });
}

// ---------- ra: poll snapshot ----------
async function poll() {
  try { const r = await fetch("/state", { cache: "no-store" }); snap = await r.json(); offline = false; }
  catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- tiện ích vẽ ----------
function fit() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + Math.max(18, o.size || 18) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2"; ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 4, { align: "center" });
}
const blink = () => Math.floor(Date.now() / 300) % 2 === 0;
function fmtTime(ticks) { const s = Math.ceil(ticks / 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
// v1.2: giỏ / kho là mảng cá thể {id, kind, fresh}; hàng ươn (fresh < 30) không tính vào "đã lấy"
const SPOIL = 30;
const kindOf = (it) => (typeof it === "string" ? it : it.kind);
const isSpoiled = (it) => typeof it === "object" && it.fresh < SPOIL;
function counts(arr, skipSpoiled) { const m = {}; (arr || []).forEach((it) => { if (skipSpoiled && isSpoiled(it)) return; const k = kindOf(it); m[k] = (m[k] || 0) + 1; }); return m; }
const freshColor = (f) => (f < SPOIL ? "#7d7d7d" : f < 50 ? "#ffb74d" : "#81c784");
function itemSlots(arr, x0, y0, sz) {
  // mỗi ô: màu loại, thanh độ tươi bên dưới, số % và nhãn "ươn" cho hàng hỏng
  (arr || []).forEach((it, i) => {
    const x = x0 + i * (sz + 6);
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x, y0, sz, sz);
    ctx.globalAlpha = isSpoiled(it) ? 0.35 : 1; ctx.fillStyle = kc(kindOf(it)); ctx.fillRect(x + 3, y0 + 3, sz - 6, sz - 6); ctx.globalAlpha = 1;
    const f = typeof it === "object" ? it.fresh : 100;
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x, y0 + sz + 2, sz, 6);
    ctx.fillStyle = freshColor(f); ctx.fillRect(x, y0 + sz + 2, sz * Math.max(0, Math.min(1, f / 100)), 6);
    text(isSpoiled(it) ? "ươn" : Math.floor(f) + "", x + sz / 2, y0 + sz / 2 + 7, { align: "center", bold: true, color: isSpoiled(it) ? "#ff8a80" : "#1a1a1a" });
  });
}
function brief(d) { try { const s = JSON.stringify(d); return s.length > 48 ? s.slice(0, 45) + "…" : s; } catch (e) { return ""; } }
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-5);
  ev.forEach((e, i) => text(`${e.name} ${brief(e.data)}`, w - 12, h - 44 - (ev.length - 1 - i) * 22, { align: "right", color: "rgba(232,238,242,.7)" }));
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {}, p = snap.player || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6, top = 96, bottom = 150;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = SET.hc ? "#000" : "#f6d6c8"; ctx.fillRect(0, top, w, SKY * s);   // ánh hồng buổi sớm
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  if (SET.hc) { g.addColorStop(0, "#00205a"); g.addColorStop(1, "#000814"); }
  else { g.addColorStop(0, "#b08a4e"); g.addColorStop(0.35, "#6f6a3a"); g.addColorStop(1, "#1d2a22"); }  // nước phù sa
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#fff1d6"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  [[10, "giữa"], [20, "sâu"]].forEach(([d, n]) => { ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke(); text(`${d} m · ${n}`, sx(0) + 6, sy(d) - 4, { color: "rgba(255,255,255,.45)" }); });
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  (snap.nodes || []).forEach((n) => {
    ctx.globalAlpha = n.ready ? 1 : 0.35; ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    if (!n.ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) - 0.8 * s, { align: "center", color: "#3a2a1a" });
  });
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180); ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill(); ctx.restore();
  });
  let monsterNear = false;
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    ctx.fillStyle = m.state === "recoil" ? "#6b5b8a" : m.state === "chase" ? "#7d2fa8" : "#4d6b3a";
    ctx.beginPath(); ctx.ellipse(mx, my, 2.0 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffe066"; ctx.beginPath(); ctx.arc(mx + 1.3 * s, my - 0.2 * s, 0.15 * s, 0, Math.PI * 2); ctx.fill();
    if (p.pos && (m.state === "chase" || Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 12)) monsterNear = true;
  });
  if (p.pos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
    // gợi ý gần bến / nút
    const inDock = Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr;
    const nearNode = p.at_surface && (snap.nodes || []).some((n) => n.ready && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= (meta.interact_radius || 2));
    const nearFish = !p.at_surface && (snap.fish || []).some((f) => Math.hypot(f.pos[0] - p.pos[0], f.pos[1] - p.pos[1]) <= (meta.catch_radius || 2));
    const tip = inDock ? "E: cập bến" : nearNode ? "E: hái" : nearFish ? "Space: bắt cá" : "";
    if (tip) text(tip, px, py - 1.2 * s, { align: "center", bold: true, color: "#fff6c8" });
  }
  // HUD
  const tl = snap.time_left_ticks;
  text("⏱ " + fmtTime(tl), 14, 32, { size: 24, bold: true, color: tl <= 1800 ? "#ff6b6b" : "#e8eef2" });
  if (p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(120, 12, 240, 26, p.oxygen_ticks / p.oxygen_max_ticks, low ? (blink() ? "#ef5350" : "#7a1f1f") : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p.hp_max) { let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡"; text(hs, 376, 34, { size: 26, color: "#ff6b81" }); }
  if (p.pos) {
    const d = p.pos[1], zone = d <= 0.5 ? "mặt nước" : d < 10 ? "nông" : d < 20 ? "giữa" : "sâu";
    text(`Độ sâu ${d.toFixed(1)} m (${zone})`, 14, 62);
  }
  if (p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 300, 62, { color: "#9fb3c0" });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)}`, w - 12, 32, { align: "right" });
  let wy = top + 44;
  if (p.oxygen_ticks === 0 && !p.at_surface) { warn("🫁", "HẾT HƠI! Nổi lên ngay", wy, blink() ? "#ff5252" : "#ffd0d0"); wy += 50; }
  else if (p.oxygen_max_ticks && !p.at_surface && p.oxygen_ticks < p.oxygen_max_ticks * 0.25) { warn("⚠", "Oxy sắp hết, nổi lên!", wy, "#ff8a65"); wy += 50; }
  if (monsterNear) {
    ctx.strokeStyle = SET.hc ? (blink() ? "#ffff00" : "#ff00ff") : "#a64dff"; ctx.lineWidth = SET.hc ? 16 : 10;
    ctx.strokeRect(5, 5, w - 10, h - 10); ctx.lineWidth = 1;
    warn("🐊", "Thủy quái gần!", wy, "#d9a6ff");
  }
  // giỏ theo loại + cần lấy
  const have = counts(snap.hold, true), cap = snap.hold_capacity || 12, y0 = h - bottom + 28;
  const spoiledN = (snap.hold || []).filter(isSpoiled).length;
  text(`Giỏ ${snap.hold_count ?? 0}/${cap}` + (spoiledN ? ` · ${spoiledN} món ươn` : ""), 14, y0, { color: spoiledN ? "#ffab91" : "#e8eef2" });
  itemSlots(snap.hold, 14, y0 + 10, 34);
  if (snap.day_plan) {
    const need = snap.day_plan.ingredients;
    text("Cần lấy (hàng tươi): " + Object.keys(need).map((k) => `${kn(k)} ${Math.min(have[k] || 0, need[k])}/${need[k]}`).join(" · "), 14, y0 + 78, { color: "#ffe9a8" });
  }
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {}, u = ui();
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 96, bottom = 60;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = SET.hc ? "#1a1206" : "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s); ctx.lineWidth = 1;
  for (let i = 0; i <= X; i += 2) { ctx.fillStyle = i % 4 ? "#ffd75e" : "#ffb347"; ctx.beginPath(); ctx.arc(sx(i), sy(Z) + 4, 4, 0, Math.PI * 2); ctx.fill(); } // đèn dây
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 7, { align: "center", color: "#111", bold: true });
    if (st.dish) text(dn(st.dish.dish_id), sx(st.pos[0]), sy(st.pos[1]) - 1.0 * s, { align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.dish) {
      const total = ((u.menu || {})[st.dish.dish_id] || { cook_s: 1 }).cook_s * 60;
      bar(sx(st.pos[0]) - 0.9 * s, sy(st.pos[1]) + 0.95 * s, 1.8 * s, 10, 1 - st.cook_ticks_left / total, "#ffb74d");
    }
    if (st.state === "ready") text("chín!", sx(st.pos[0]), sy(st.pos[1]) + 1.5 * s, { align: "center", bold: true, color: "#1b3a12" });
  });
  const patMax = (meta.patience_s || 60) * 60, byTable = {}, angry = [], angryAt = [];
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 7, { align: "center", bold: true });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.4 * s, frac = c.patience_ticks_left / patMax;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.5 * s, 0, Math.PI * 2); ctx.fill();
      text(dn(c.dish_id), cx, cy - 0.7 * s, { align: "center", color: SET.hc ? "#fff" : "#2a1a0a" });
      if (c.state === "waiting") bar(cx - 1.1 * s, cy + 0.6 * s, 2.2 * s, 10, frac, frac < 0.25 ? (blink() ? "#e53935" : "#ff8a80") : "#66bb6a");
      if (c.state === "waiting" && frac < 0.25) { angry.push(tb.id); angryAt.push([cx + 0.7 * s, cy]); }
    }
  });
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 32, { size: 24, bold: true, color: snap.time_left_ticks <= 1800 ? "#ff6b6b" : "#e8eef2" });
  text(`Thu ca ${(u.stats && u.stats.money) || 0}k · Tiền ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)} · Điểm ${snap.score ?? 0}`, 130, 32);
  // kho khả dụng = cá thể chưa ươn và chưa ai giữ; kèm độ tươi trung bình và số món ươn từng loại
  const held = new Set();
  (snap.customers || []).forEach((c) => (c.reserved || []).forEach((id) => held.add(id)));
  const byKind = {};
  (snap.stock || []).forEach((it) => {
    const b = (byKind[it.kind] = byKind[it.kind] || { free: 0, spoiled: 0, sum: 0, n: 0 });
    if (isSpoiled(it)) b.spoiled++; else { b.sum += it.fresh; b.n++; if (!held.has(it.id)) b.free++; }
  });
  const parts = Object.keys(byKind).map((k) => { const b = byKind[k]; return `${kn(k)} ${b.free}` + (b.n ? ` (${Math.round(b.sum / b.n)}%)` : "") + (b.spoiled ? ` +${b.spoiled} ươn` : ""); });
  text("Kho khả dụng: " + (parts.join(", ") || "(trống)"), 14, 62, { color: "#cfd8dc" });
  text("Trên tay: " + (snap.hand ? `${dn(snap.hand.dish_id)} (${snap.hand.base_price}k)` : "(trống)"), 14, 88, { color: "#ffe9a8" });
  // nhãn "SẮP GIẬN" cạnh từng khách, vẽ sau cùng để không bị bàn / người chơi che
  angryAt.forEach(([x, y]) => {
    ctx.font = "bold 20px system-ui, sans-serif";
    const lw = ctx.measureText("! SẮP GIẬN").width + 16;
    ctx.fillStyle = SET.hc ? "#000" : "#b71c1c"; ctx.fillRect(x, y - 15, lw, 30);
    if (SET.hc) { ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 3; ctx.strokeRect(x, y - 15, lw, 30); ctx.lineWidth = 1; }
    text("! SẮP GIẬN", x + lw / 2, y + 7, { align: "center", bold: true, size: 20, color: SET.hc ? "#ffff00" : "#fff" });
  });
  if (angry.length) warn("😠", `Khách bàn ${angry.join(", ")} sắp giận!`, h - 70, "#ff8a80");
}

// ----- SHOP -----
function drawShop(w, h) {
  const u = ui(), ups = u.shop || {}, have = snap.upgrades || {};
  ctx.fillStyle = "#2b2118"; ctx.fillRect(0, 0, w, h);
  text("Tiệm của Chú Sáu — nâng cấp cho lần lặn sau", w / 2, 70, { align: "center", size: 28, bold: true, color: "#ffd27a" });
  text(`Tiền ${snap.money}k · đóng sau ${Math.ceil(snap.time_left_ticks / 60)}s`, w / 2, 106, { align: "center" });
  Object.keys(ups).forEach((id, i) => {
    const lv = have[id] || 0, nxt = ups[id][lv], y = 170 + i * 70;
    const info = nxt ? `cấp ${nxt.level}: ${nxt.price}k → ${id === "oxygen" ? nxt.oxygen_max_s + " s oxy" : nxt.hp_max + " Máu"}` : "đã tối đa";
    text(`[${i + 1}] ${UP_NAME[id] || id} — đang cấp ${lv} · ${info}`, w / 2, y, { align: "center", size: 22, color: nxt && snap.money >= nxt.price ? "#e8eef2" : "#9fb3c0" });
  });
  text("Cấp mới có hiệu lực từ Ngày kế tiếp.  Enter: xong", w / 2, 340, { align: "center", color: "#9fb3c0" });
  const last = (snap.events || []).filter((e) => e.name === "bought" || e.name === "buy_failed").slice(-1)[0];
  if (last) text(last.name === "bought" ? `Đã mua ${UP_NAME[last.data.upgrade]} cấp ${last.data.level}` : `Không mua được (${last.data.reason === "funds" ? "thiếu tiền" : last.data.reason === "max_level" ? "đã tối đa" : last.data.reason})`, w / 2, 390, { align: "center", color: last.name === "bought" ? "#a5d6a7" : "#ff8a80" });
}

// ----- màn giới thiệu / kết quả (HTML) -----
function introHtml() {
  const u = ui(), it = u.intro, st = u.stats || {};
  if (!it) return "";
  const plan = snap.day_plan || { dishes: {}, ingredients: {} };
  const li = (o, f) => Object.keys(o).map((k) => `<li>${f(k, o[k])}</li>`).join("");
  if (it.kind === "day_intro") return `<h2>Ngày ${snap.day}</h2><p>Má Tư dặn: hôm nay quán nấu</p><ul>${li(plan.dishes, (d, n) => `${dn(d)} × ${n}`)}</ul>
    <p>Cần lấy: ${Object.keys(plan.ingredients).map((k) => kn(k) + " × " + plan.ingredients[k]).join(", ")}</p><p class="hint">Nhấn phím bất kỳ để xuống sông…</p>`;
  if (it.kind === "evening_intro") {
    const all = counts(snap.stock), stock = counts(snap.stock, true), menu = u.menu || {};
    const nSpoiled = (snap.stock || []).filter(isSpoiled).length;
    const can = Object.keys(plan.dishes).filter((d) => Object.keys(menu[d].recipe).every((k) => (stock[k] || 0) >= menu[d].recipe[k]));
    return `<h2>Tối Ngày ${snap.day} — mở quán</h2><p>Nhập kho: ${Object.keys(all).map((k) => kn(k) + " × " + all[k]).join(", ") || "(không có gì)"}${nSpoiled ? ` (${nSpoiled} món đã ươn)` : ""}</p>
      <p>Món nấu được: ${can.map(dn).join(", ") || "(chưa đủ nguyên liệu món nào)"}</p><p class="hint">Nhấn phím bất kỳ để mở quán…</p>`;
  }
  if (it.kind === "day_result") {
    const dr = (st.rep_end ?? 0) - (st.rep_start ?? 0);
    return `<h2>Kết quả Ngày ${snap.day}</h2><p>Khách đã phục vụ: ${st.served} · bỏ đi: ${st.left}</p><p>Tiền thu: ${st.money}k (boa ${st.tips}k)</p>
      <p>Uy tín: ${dr >= 0 ? "+" : ""}${dr.toFixed(1)} → ${(snap.reputation ?? 0).toFixed(1)}</p><p class="hint">Nhấn phím bất kỳ để vào tiệm…</p>`;
  }
  if (it.kind === "summary") {
    const by = (u.totals || {}).served_by_dish || {}, best = Object.keys(by).sort((a, b) => by[b] - by[a])[0];
    return `<h1>Tổng kết</h1><p>Tổng tiền thu: ${snap.earned}k · còn ${snap.money}k</p><p>Tổng điểm: ${snap.score} · Uy tín ${(snap.reputation ?? 0).toFixed(1)}</p>
      <p>Món bán chạy: ${best ? dn(best) + " (" + by[best] + " suất)" : "(chưa bán món nào)"}</p>${leaderboardHtml(u.leaderboard)}<button class="btn" onclick="fetch('/menu',{method:'POST'})">Về menu</button>`;
  }
  return "";
}
function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function leaderboardHtml(lb) {
  if (!lb) return "";
  const rows = lb.entries.map((e, i) => `<tr><td>${i + 1}</td><td>${esc(e.name)}</td><td>${e.score}</td><td>seed ${e.seed}</td></tr>`).join("");
  const form = lb.eligible && !lb.saved
    ? `<p><input class="name" id="lbName" maxlength="24" placeholder="Tên của bạn" value="Út Sen"> <button class="btn" style="display:inline-block;width:auto" onclick="saveScore()">Lưu điểm</button></p>`
    : lb.saved ? `<p class="hint">Đã lưu vào bảng xếp hạng.</p>` : `<p class="hint">Chỉ lượt chuẩn 5 Ngày (không scenario) mới được ghi bảng xếp hạng.</p>`;
  return `<h2>Bảng xếp hạng</h2><table class="lb">${rows || "<tr><td>(chưa có ai)</td></tr>"}</table>${form}`;
}
function saveScore() {
  const name = ($("lbName") && $("lbName").value || "").trim();
  if (name) post("/leaderboard", { name });
}
let lastIntro = "";
function overlays() {
  const u = ui();
  $("menu").classList.toggle("on", u.screen === "menu");
  $("quit").classList.toggle("on", u.screen === "quit");
  $("pause").classList.toggle("on", u.screen === "game" && snap.state === "paused");
  const html = u.screen === "game" ? introHtml() : "";
  $("intro").classList.toggle("on", !!html);
  // không vẽ lại thẻ khi đang gõ tên (giữ con trỏ trong ô nhập)
  if (html !== lastIntro && document.activeElement?.id !== "lbName") { $("introCard").innerHTML = html; lastIntro = html; }
}

// ---------- chế độ benchmark (?bench=1&warmup=3&duration=30): chonoi.bench mở trang headless ----------
const BQ = new URLSearchParams(location.search);
const BENCH = BQ.get("bench") === "1" ? { warmup: +BQ.get("warmup") || 3, duration: +BQ.get("duration") || 30, first: null, stamps: [], sent: false } : null;
function benchTick(ts) {
  if (!BENCH || BENCH.sent || !snap) return;
  if (BENCH.first === null) { BENCH.first = ts; post("/bench/first", {}); return; }  // khung đầu tiên của cảnh đo
  const t = (ts - BENCH.first) / 1000;
  if (t < BENCH.warmup) return;
  BENCH.stamps.push(ts);
  if (t >= BENCH.warmup + BENCH.duration) { BENCH.sent = true; post("/bench/result", { stamps: BENCH.stamps }); }
}

function frame(ts) {
  requestAnimationFrame(frame);
  benchTick(ts);
  const [w, h] = fit();
  ctx.fillStyle = SET.hc ? "#000" : "#10161c"; ctx.fillRect(0, 0, w, h);
  if (!snap) { text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center" }); return; }
  if (snap.phase === "shop") drawShop(w, h); else if (snap.phase === "quan") drawQuan(w, h); else drawGather(w, h);
  if (snap.day) text(`Ngày ${snap.day}${ui().days ? "/" + ui().days : ""}`, w / 2, 32, { align: "center", bold: true, color: "#ffd27a" });
  if (!BENCH) onEvents(snap.events || []);
  eventLog(w, h);
  drawCaptions(w, h);
  text("WASD · E · Space · Esc/P tạm dừng · H tương phản · M âm thanh · C phụ đề · R chơi lại", w - 12, h - 14, { align: "right", color: SET.hc ? "#fff" : "#9fb3c0" });
  if (offline) text("Mất kết nối tới máy chủ", w / 2, 60, { align: "center", color: "#ff8a80" });
  if (snap.error) text("Luật báo lỗi — xem terminal. R để chơi lại.", w / 2, 84, { align: "center", color: "#ff8a80" });
  if (snap.finished && snap.mode !== "day") text("Buổi kết thúc: " + (snap.reason || "") + " — R để chơi lại", w / 2, h / 2, { align: "center", size: 26, bold: true });
  overlays();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
